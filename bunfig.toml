[install]
linker = "isolated"
minimumReleaseAge = 604800  # 7 days in seconds
# Pinned upstream editor packages this fork consumes directly; the release-age
minimumReleaseAgeExcludes = ["@pierre/diffs", "@pierre/theme", "@pierre/theming"]

[test]
preload = ["./tests/setup/temp-dir-sweep.ts", "./tests/setup/feedback-archive-off.ts"]
