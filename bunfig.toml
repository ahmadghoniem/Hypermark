[install]
linker = "isolated"
minimumReleaseAge = 604800  # 7 days in seconds
# Pinned upstream editor packages this fork consumes directly; the release-age
# gate would otherwise hold back a fix we are waiting on.
minimumReleaseAgeExcludes = ["@pierre/diffs", "@pierre/theme", "@pierre/theming", "@plannotator/atomic-editor", "@plannotator/markdown-editor", "@plannotator/webtui"]

[test]
preload = ["./tests/setup/temp-dir-sweep.ts", "./packages/ui/test-setup/happy-dom.ts", "./tests/setup/feedback-archive-off.ts"]
