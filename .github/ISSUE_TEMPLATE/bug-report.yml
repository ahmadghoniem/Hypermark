name: Bug report
description: Something broke or didn't behave as expected
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead. Screenshots welcome.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Hypermark version
      description: Paste the output of `hypermark --version`
      placeholder: hypermark 0.1.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - macOS
        - Linux
        - Windows
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where did it happen?
      options:
        - Annotate
        - Install / CLI
        - Other
    validations:
      required: true
